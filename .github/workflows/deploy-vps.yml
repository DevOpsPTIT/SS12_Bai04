# ============================================================
# CI/CD Pipeline: Build Image → Deploy to VPS via SSH
# Bài 4 - Session 12: Tự động triển khai lên VPS qua SSH
# ============================================================
# Mô tả:
#   Workflow này gồm 2 Job nối tiếp nhau:
#
#   Job 1 — build-image:
#     Build Docker Image từ source code và push lên GHCR.
#
#   Job 2 — deploy-vps (needs: build-image):
#     SSH vào VPS, pull Image mới từ GHCR, và khởi chạy
#     lại Container ứng dụng.
#
# Secrets bắt buộc (Settings → Secrets and variables → Actions):
#   SSH_HOST  : Địa chỉ IP hoặc hostname của VPS
#   SSH_USER  : Tên user SSH trên VPS (vd: ubuntu, root)
#   SSH_KEY   : Nội dung Private Key SSH (-----BEGIN OPENSSH PRIVATE KEY-----)
#
# ============================================================

name: CI/CD - Build & Deploy to VPS

on:
  push:
    branches:
      - main

# Quyền ghi vào GitHub Packages để push Docker Image
permissions:
  contents: read
  packages: write

env:
  # Tên image đầy đủ trên GHCR — dùng chung ở cả 2 job
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/spring-vps-app

jobs:
  # ===========================================================
  # JOB 1: build-image
  # Build Docker Image từ source code và push lên GHCR
  # ===========================================================
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Đăng nhập GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bước 3: Thiết lập Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 4: Trích xuất metadata (tag :latest + :sha)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Bước 5: Build và Push Image lên GHCR
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================
  # JOB 2: deploy-vps
  # SSH vào VPS → pull Image mới → restart Container
  # Chỉ chạy sau khi build-image hoàn thành thành công
  # ===========================================================
  deploy-vps:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    needs: build-image         # Phụ thuộc vào Job build-image

    steps:
      # Bước 1: SSH vào VPS và thực thi lệnh triển khai
      - name: Deploy application on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Timeout kết nối SSH (giây)
          connect_timeout: 30s
          script: |
            echo "============================================"
            echo "  DEPLOYING: spring-vps-app"
            echo "  Image : ${{ env.IMAGE_NAME }}:latest"
            echo "  Commit: ${{ github.sha }}"
            echo "============================================"

            # Đăng nhập GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin

            # Kéo Image mới nhất từ GHCR
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Dừng và xóa container cũ (bỏ qua lỗi nếu chưa tồn tại)
            docker stop spring-vps-app || true
            docker rm   spring-vps-app || true

            # Khởi chạy container mới
            docker run -d \
              --name spring-vps-app \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ env.IMAGE_NAME }}:latest

            # Đợi container khởi động
            sleep 5

            # Kiểm tra container đang chạy
            docker ps --filter "name=spring-vps-app" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ Deployment complete!"
            echo "   App running at: http://${{ secrets.SSH_HOST }}:8080"
